name: Validate journal

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check docs/design-content.js
          node --check docs/design-revision-four.js
          node --check docs/app.js
          node --check docs/lore.js
          node --check docs/concept-art.js
          node --check docs/progression-survey.js
      - name: Verify saved-progress migrations
        run: |
          node tests/concept-migration.cjs
          node tests/progression-survey.cjs
