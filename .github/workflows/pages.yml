name: Deploy journal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check docs/design-content.js
          node --check docs/design-revision-four.js
          node --check docs/app.js
          node --check docs/lore.js
          node --check docs/progression-survey.js
      - name: Verify saved-progress migrations
        run: |
          node tests/concept-migration.cjs
          node tests/progression-survey.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static journal
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: validate-and-upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
